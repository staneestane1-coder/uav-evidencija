<!DOCTYPE html>
<html lang="bs">
<head>
<script src="../../shared/auth.js" data-required-role="operater" data-login-path="../../login/login.html"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAV Evidencija – Moji letovi</title>
<link rel="stylesheet" href="../../shared/layout.css">
<link rel="stylesheet" href="../dashboard-operater.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">✈</span>
            <h1>UAV Evidencija</h1>
        </div>

        <ul class="nav-list">
            <li class="nav-item"><a href="../dashboard-operater.html"><span class="nav-icon" aria-hidden="true">📊</span> Pregled</a></li>
            <li class="nav-item active"><a href="dashboard-operater-letovi.html"><span class="nav-icon" aria-hidden="true">🗺</span> Moji letovi <span class="nav-badge" id="activeWarningsBadge"></span></a></li>
            <li class="nav-item"><a href="../dronovi/dashboard-operater-dronovi.html"><span class="nav-icon" aria-hidden="true">🛰</span> Moji dronovi</a></li>
            <li class="nav-item"><a href="../snimci/dashboard-operater-snimci.html"><span class="nav-icon" aria-hidden="true">📷</span> Moji snimci</a></li>
        </ul>

        <div class="nav-divider"></div>
        <div class="nav-logout">
            <a href="#" id="logoutBtn"><span class="nav-icon" aria-hidden="true">⏻</span> Odjava</a>
        </div>
    </nav>

    <main class="main">
        <div class="page-header">
            <div>
                <h2>Moji letovi</h2>
                <p>Pregled svih letova koje ste prijavili</p>
            </div>
            <a href="../prijavi-let/dashboard-operater-prijavi-let.html" class="btn-add">
                <span>+</span> Prijavi let
            </a>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <label for="filterStatus">Status</label>
                <select id="filterStatus">
                    <option value="svi">Svi statusi</option>
                    <option value="na-cekanju">Na čekanju</option>
                    <option value="zavrsen">Završen</option>
                    <option value="u-letu">U letu</option>
                    <option value="planiran">Planiran</option>
                    <option value="odbijen">Odbijen</option>
                    <option value="otkazan">Otkazan</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filterDrone">Dron</label>
                <select id="filterDrone">
                    <option value="svi">Svi dronovi</option>
                </select>
            </div>

            <div class="filter-group search">
                <label for="filterSearch">Pretraga lokacije</label>
                <input type="text" id="filterSearch" placeholder="npr. Trebinje">
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>Letovi</h3>
                <span class="result-count" id="resultCount"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Dron</th><th>Lokacija</th><th>Status</th><th>Trajanje</th><th>Vrijeme</th><th>Akcije</th>
                    </tr>
                </thead>
                <tbody id="letoviBody">
                    <tr><td colspan="6" style="text-align:center;padding:20px;color:#7a9bbf;">Učitavanje...</td></tr>
                </tbody>
            </table>
            <p class="empty-state" id="emptyState">Nema letova koji odgovaraju odabranim filterima.</p>
        </div>
    </main>

    <script src="../../shared/api-config.js"></script>
    <script src="../../shared/api.js"></script>
    <script src="../../shared/change-password-modal.js"></script>
    <script src="../../shared/active-warnings-badge.js"></script>
    <script src="../../shared/snimci-utils.js"></script>
    <script src="dashboard-operater-letovi.js"></script>
    <script src="../../shared/dashboard-admin-logout.js" data-login-path="../../login/login.html"></script>
</body>
</html>
