<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Evidencija – Reset lozinke</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-brand">
            <div class="brand-icon">✈</div>
            <h1>UAV Evidencija</h1>
            <p>Sistem za nadzor i evidenciju bespilotnih letjelica</p>
        </div>

        <div class="login-card">
            <h2>Postavite novu lozinku</h2>

            <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label for="newPassword">Nova lozinka</label>
                    <input type="password" id="newPassword" placeholder="Unesite novu lozinku" autocomplete="new-password" maxlength="128" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Potvrdi novu lozinku</label>
                    <input type="password" id="confirmPassword" placeholder="Ponovite novu lozinku" autocomplete="new-password" maxlength="128" required>
                </div>

                <div class="error-msg" id="errorMsg"></div>
                <div class="success-msg" id="successMsg"></div>

                <button type="submit" class="btn-login" id="submitBtn">Postavi novu lozinku</button>

                <p class="form-hint"><a href="login.html">Nazad na prijavu</a></p>
            </form>
        </div>

        <div class="login-footer">
            Pristup isključivo za ovlašteno osoblje.
        </div>

    </div>

    <script src="../shared/api-config.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../shared/password-policy.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
