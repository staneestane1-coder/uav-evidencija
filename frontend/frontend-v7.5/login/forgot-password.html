<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Evidencija – Zaboravljena lozinka</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-wrapper">

        <div class="login-brand">
            <div class="brand-icon">✈</div>
            <h1>UAV Evidencija</h1>
            <p>Sistem za nadzor i evidenciju bespilotnih letjelica</p>
        </div>

        <div class="login-card">
            <h2>Zaboravljena lozinka</h2>
            <p class="subtitle">Unesite korisničko ime i email adresu naloga - poslaćemo Vam link za postavljanje nove lozinke.</p>

            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="username">Korisničko ime</label>
                    <input type="text" id="username" placeholder="Unesite korisničko ime" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email adresa</label>
                    <input type="email" id="email" placeholder="Unesite email adresu naloga" autocomplete="email" required>
                </div>

                <div class="error-msg" id="errorMsg"></div>
                <div class="success-msg" id="successMsg"></div>

                <button type="submit" class="btn-login" id="submitBtn">Pošalji link za reset</button>

                <p class="form-hint"><a href="login.html">Nazad na prijavu</a></p>
            </form>
        </div>

        <div class="login-footer">
            Pristup isključivo za ovlašteno osoblje.
        </div>

    </div>

    <script src="../shared/api-config.js"></script>
    <script src="../shared/api.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
