<!DOCTYPE html>
<html lang="bs">
<head>
<script src="../../shared/auth.js" data-required-role="administrator" data-login-path="../../login/login.html"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAV Evidencija – Aktivnosti</title>
<link rel="stylesheet" href="../../shared/layout.css">
<link rel="stylesheet" href="dashboard-admin-aktivnosti.css">
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">✈</span>
            <h1>UAV Evidencija</h1>
        </div>

        <ul class="nav-list">
            <li class="nav-item"><a href="../dashboard-admin.html"><span class="nav-icon" aria-hidden="true">📊</span> Pregled</a></li>
            <li class="nav-item"><a href="../korisnici/dashboard-admin-korisnici.html"><span class="nav-icon" aria-hidden="true">👤</span> Korisnici</a></li>
            <li class="nav-item"><a href="../dronovi/dashboard-admin-dronovi.html"><span class="nav-icon" aria-hidden="true">🛰</span> Dronovi</a></li>
            <li class="nav-item"><a href="../letovi/dashboard-admin-letovi.html"><span class="nav-icon" aria-hidden="true">🗺</span> Letovi</a></li>
            <li class="nav-item active"><a href="dashboard-admin-aktivnosti.html"><span class="nav-icon" aria-hidden="true">📋</span> Aktivnosti</a></li>
            <li class="nav-item"><a href="../snimci/dashboard-admin-snimci.html"><span class="nav-icon" aria-hidden="true">📷</span> Snimci s terena</a></li>
        </ul>

        <div class="nav-divider"></div>
        <div class="nav-logout">
            <a href="#" id="logoutBtn"><span class="nav-icon" aria-hidden="true">⏻</span> Odjava</a>
        </div>
    </nav>

    <main class="main">
        <div class="page-header" style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;">
            <div>
                <h2>Aktivnosti</h2>
                <p>Kompletna evidencija svih dešavanja u sistemu</p>
            </div>
            <button id="btnOcistiFajlove" title="Briše fajlove na disku koji više nisu povezani ni sa jednim snimkom u bazi (npr. ostali poslije ranijih brisanja letova/dronova)"
                style="display:inline-flex;align-items:center;gap:8px;padding:11px 20px;background:#5a6472;color:#fff;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;white-space:nowrap;">
                🧹 Očisti osirotele fajlove
            </button>
        </div>

        <div class="filters">
            <input type="text" class="search-input" id="activitySearchInput" placeholder="Pretraži po korisniku, aktivnosti ili dronu..." aria-label="Pretraži po korisniku, aktivnosti ili dronu...">

            <select class="filter-select" id="activityTypeFilter" aria-label="Filtriraj po tipu aktivnosti">
                <option value="">Svi tipovi</option>
                <option value="let">Letovi</option>
                <option value="dron">Dronovi</option>
                <option value="korisnik">Korisnici</option>
                <option value="sigurnost">Sigurnost</option>
                <option value="sistem">Sistem</option>
            </select>

            <select class="filter-select" id="activityStatusFilter" aria-label="Filtriraj po statusu">
                <option value="">Svi statusi</option>
                <option value="uspjesno">Uspješno</option>
                <option value="novo">Informacija</option>
                <option value="upozorenje">Upozorenje</option>
                <option value="greska">Greška</option>
            </select>
        </div>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Korisnik</th>
                        <th>Aktivnost</th>
                        <th>Dron</th>
                        <th>Status</th>
                        <th>Vrijeme</th>
                    </tr>
                </thead>
                <tbody id="activitiesTableBody">
                    <tr><td colspan="5" class="empty-state">Učitavanje...</td></tr>
                </tbody>
            </table>
            <p class="empty-state" id="activitiesEmptyState" style="display:none; padding:24px; text-align:center; color:#7a9bbf;">
                Nema aktivnosti koje odgovaraju pretrazi.
            </p>
        </div>
    </main>
        <script src="../../shared/api-config.js"></script>
        <script src="../../shared/api.js"></script>
        <script src="../../shared/change-password-modal.js"></script>
        <script src="../../shared/snimci-utils.js"></script>
        <script src="dashboard-admin-aktivnosti.js"></script>
        <script src="../../shared/dashboard-admin-logout.js" data-login-path="../../login/login.html"></script>
</body>
</html>
