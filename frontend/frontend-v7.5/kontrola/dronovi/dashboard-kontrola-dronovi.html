            <select class="filter-select" id="droneStatusFilter" aria-label="Filtriraj po statusu">

                <option value="aktivan">Aktivan</option>
                <option value="servis">U servisu</option>
                <option value="neaktivan">Offline</option>

        <p class="empty-state" id="droneEmptyState" style="display:none; padding:24px; text-align:center; color:#7a9bbf;">
